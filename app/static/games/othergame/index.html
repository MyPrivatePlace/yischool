    <div class="ctrl">

    </div>

};
function heuristicImage(word){
  if(/面$/.test(word)) return "Chinese noodles.jpg";
  if(/汤$/.test(word)) return "Chinese soup.jpg";
  if(/饭$/.test(word)) return "Bowl of rice.jpg";
  if(/茶$/.test(word)) return "Green tea in cup.jpg";
  if(/果$/.test(word)) return "Fruit assortment.jpg";
  if(/书$/.test(word)) return "Stack of books.jpg";
  if(/鱼$/.test(word)) return "Cooked fish dish.jpg";
  if(/肉$/.test(word)) return "Cooked meat dish.jpg";
  return null;
}
function suggestImage(word){
  if(IMAGE_MAP[word]) return IMAGE_MAP[word];
  const simple = word.replace(/[的地得]/g,"").replace(/子$/,"");
  if(IMAGE_MAP[simple]) return IMAGE_MAP[simple];
  return heuristicImage(word);
}
function autoFillImages(targetList){
  (targetList || VOCAB).forEach(v=>{
    if(!v.img){
      const f = suggestImage(v.word);
      if(f) v.img = IMG(f);
    }
  });
}

/* ==== 工具函数 ==== */
const $ = (s)=>document.querySelector(s);
function escapeHTML(s){
  const map = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'};
  return String(s ?? '').replace(/[&<>"']/g, ch => map[ch]);
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const pad = n => String(n).padStart(2,'0');
const fmtTime = s => `${pad(Math.floor(s/60))}:${pad(s%60)}`;

/* ==== 多选勾选（单行控件） ==== */
function buildLessonPicker(){
  const sel = document.getElementById('lesson');
  const lessons = Array.from(new Set(VOCAB.map(v=>v.lesson))).sort((a,b)=>a-b);
  sel.innerHTML = ['<option value="all" selected>全部课次</option>'].concat(lessons.map(L=>`<option value="${L}">第${L}课</option>`)).join('');
  const ms = document.getElementById('lessonPicker');
  ms.innerHTML = `<button type="button" id="msBtn"><span id="msText">全部课次</span><span>▾</span></button>
                  <div class="panel" id="msPanel"></div>
                  <div class="hint" id="msHint"></div>`;
  const panel = document.getElementById('msPanel');
  panel.innerHTML = Array.from(sel.options).map(o=>`<label class="row"><input type="checkbox" class="msOpt" value="${o.value}" ${o.selected?'checked':''}>${o.textContent}</label>`).join('');

  function normalizeAll(){
    const all = panel.querySelector('.msOpt[value="all"]');
    const others = Array.from(panel.querySelectorAll('.msOpt:not([value="all"])'));
    if(!all) return;
    const anyOther = others.some(i=>i.checked);
    all.checked = !anyOther;
  }
  function summarize(){
    const vals = getSelectedLessons();
    const text = (vals.includes('all')||!vals.length)?'全部课次':`已选 ${vals.length} 课`;
    document.getElementById('msText').textContent = text;
    const names = Array.from(panel.querySelectorAll('.msOpt:checked')).map(i=> i.parentElement.textContent.trim());
    document.getElementById('msHint').textContent = names.join('、');
  }
  ms.addEventListener('click', e=>{ if(e.target.closest('#msBtn')) ms.classList.toggle('open'); });
  document.addEventListener('click', e=>{ if(!ms.contains(e.target)) ms.classList.remove('open'); });
  panel.addEventListener('change', e=>{ if(e.target.classList.contains('msOpt')){ normalizeAll(); summarize(); }});

  window.getSelectedLessons = function(){
    const selected = Array.from(panel.querySelectorAll('.msOpt:checked')).map(i=> i.value);
    if(!selected.length || selected.includes('all')) return ['all'];
    return selected;
  };

  normalizeAll(); summarize();
}

/* ==== 词库筛选与组牌 ==== */
function buildPool(lessonValues){
  let pool = VOCAB.slice();
  if(!lessonValues || lessonValues.includes('all')) return pool;
  const set = new Set(lessonValues.map(v=> parseInt(v,10)));
  return pool.filter(v=> set.has(v.lesson));
}
function makeDeck(pool, pairs, imgPriority){
  const uniq=[]; const seen = new Set();
  for(const v of pool){ if(!seen.has(v.word)){ uniq.push(v); seen.add(v.word); } }
  if(!uniq.length) throw new Error('词库为空或筛选后无可用词。');
  if(uniq.length < pairs) pairs = Math.max(6, uniq.length);
  shuffle(uniq);
  const chosen = uniq.slice(0, pairs);
  autoFillImages(chosen);
  const deck=[];
  chosen.forEach((v, idx)=>{
    const pairId = `p${v.lesson}_${idx}_${v.word}`;
    deck.push({ id:pairId, kind:'word', lesson:v.lesson,
      front:()=>`<div class="face front"><div>❓</div><span class="badge">第${v.lesson}课</span></div>`,
      back: ()=>`<div class="face back"><span class="badge">第${v.lesson}课</span><div class="label">${escapeHTML(v.word)}</div><div class="sub">${escapeHTML(v.py||'')}</div></div>`
    });
    const useImg = imgPriority && v.img;
    deck.push({ id:pairId, kind: useImg?'img':'info', lesson:v.lesson,
      front:()=>`<div class="face front"><div>❓</div><span class="badge">第${v.lesson}课</span></div>`,
      back: ()=>`<div class="face back"><span class="badge">第${v.lesson}课</span>${ useImg ? `<img class="photo" data-fallback="${escapeHTML(v.py||'')}|||${escapeHTML(v.def||'')}" src="${v.img}" alt="${escapeHTML(v.word)}">` : `<div class="label">${escapeHTML(v.py||'')}</div><div class="sub">${escapeHTML(v.def||'')}</div>` }</div>`
    });
  });
  shuffle(deck);
  const board = document.getElementById('board'); board.innerHTML='';
  deck.forEach((card, i)=>{
    const node = document.createElement('div'); node.className='card'; node.setAttribute('data-i', i);
    node.innerHTML = `<div class="flip">${card.front()}${card.back()}</div>`;
    node.addEventListener('click', onFlip); board.appendChild(node);
  });
  // 图片失败回退
  board.querySelectorAll('img.photo').forEach(img=>{
    img.addEventListener('error', ()=>{
      const fb = (img.getAttribute('data-fallback')||'').split('|||');
      const py=fb[0]||'', df=fb[1]||''; const w=img.parentElement; img.remove();
      const d1=document.createElement('div'); d1.className='label'; d1.textContent=py;
      const d2=document.createElement('div'); d2.className='sub'; d2.textContent=df; w.appendChild(d1); w.appendChild(d2);
    }, {once:true});
  });
  // 词表
  const wl = document.getElementById('wordList');
  wl.innerHTML = chosen.map(v=>{
    const tag = (imgPriority && v.img)? '🖼️':'ℹ️';
    return `<div class="vitem">${tag} 第${v.lesson}课 · <b>${escapeHTML(v.word)}</b> · ${escapeHTML(v.py||'')} — ${escapeHTML(v.def||'')}</div>`;
  }).join('');
  return deck;
}

/* ==== 游戏主逻辑 ==== */
let state = { deck:[], first:null, second:null, lock:false, moves:0, matched:0, targetPairs:12, lessons:['all'], imgPriority:true, secs:0, timer:null };

function onFlip(e){
  const el = e.currentTarget; const i = parseInt(el.getAttribute('data-i'), 10);
  if(state.lock || el.classList.contains('matched')) return;
  if(!el.classList.contains('revealed')) el.classList.add('revealed');
  if(state.first === null){ state.first = i; }
  else if(state.second === null && i !== state.first){ state.second = i; state.moves++; renderStats(); checkMatch(); }
}
function checkMatch(){
  const a = state.deck[state.first], b = state.deck[state.second];
  const cards = document.getElementById('board').querySelectorAll('.card');
  const ca = cards[state.first], cb = cards[state.second];
  const isMatch = (a.id===b.id) && (a.kind!==b.kind);
  if(isMatch){ [ca,cb].forEach(el=> el.classList.add('matched')); state.matched++; state.first = state.second = null; renderStats(); if(state.matched===state.targetPairs){ clearInterval(state.timer); } }
  else{ state.lock = true; [ca,cb].forEach(el=> el.classList.add('wrong')); setTimeout(()=>{ [ca,cb].forEach(el=> el.classList.remove('wrong','revealed')); state.first = state.second = null; state.lock=false; }, 650); }
}
function renderStats(){ document.getElementById('moves').textContent = state.moves; document.getElementById('matched').textContent = `${state.matched}/${state.targetPairs}`; }

function limitPairs(n, lessons){
  const poolSize = buildPool(lessons).length;
  document.getElementById('poolSize').textContent = poolSize;
  const min=6, max=Math.min(36, poolSize||36);
  const num = Number.isFinite(n)? n:12;
  return Math.max(min, Math.min(max, num));
}
function startGame(){
  try{
    const lessons = (typeof window.getSelectedLessons==='function')? window.getSelectedLessons(): ['all'];
    const want = parseInt((document.getElementById('pairs')||{value:12}).value, 10) || 12;
    const imgPriority = ((document.getElementById('imgPriority')||{value:'on'}).value === 'on');
    state.lessons = lessons; state.targetPairs = limitPairs(want, lessons); state.imgPriority = imgPriority;
    const pool = buildPool(lessons); document.getElementById('poolSize').textContent = pool.length;
    state.deck = makeDeck(pool, state.targetPairs, state.imgPriority);
    state.first=state.second=null; state.lock=false; state.moves=0; state.matched=0;
    clearInterval(state.timer); state.secs=0; document.getElementById('time').textContent='00:00';
    state.timer = setInterval(()=>{ state.secs+=1; document.getElementById('time').textContent = fmtTime(state.secs); },1000);
    renderStats();
  }catch(err){ console.error(err); alert('⚠️ 渲染失败：'+ err.message); }
}

/* ==== 初始化 ==== */
document.addEventListener('DOMContentLoaded', ()=>{ buildLessonPicker(); document.getElementById('start').addEventListener('click', startGame); startGame(); });
